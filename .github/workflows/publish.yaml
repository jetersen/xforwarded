name: Build and publish

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: linux-x64
            runner: ubuntu-26.04
          - arch: arm64
            rid: linux-arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set image tag
        id: image-tag
        run: echo "tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install NativeAOT zlib headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build NativeAOT SDK container
        env:
          RID: ${{ matrix.rid }}
          ARCH: ${{ matrix.arch }}
        run: >-
          dotnet publish src/HttpHeaders.Api/HttpHeaders.Api.csproj
          -t:PublishContainer -c Release -r "$RID" --warnaserror
          -p:ContainerImageTag="build-$ARCH"

  publish-platform:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: linux-x64
            runner: ubuntu-26.04
          - arch: arm64
            rid: linux-arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install NativeAOT zlib headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish NativeAOT container with the SDK
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          RID: ${{ matrix.rid }}
          ARCH: ${{ matrix.arch }}
        run: >-
          dotnet publish src/HttpHeaders.Api/HttpHeaders.Api.csproj
          -t:PublishContainer -c Release -r "$RID" --warnaserror
          -p:ContainerRegistry="$REGISTRY" -p:ContainerRepository="$IMAGE_NAME"
          -p:ContainerImageTag="$IMAGE_TAG-$ARCH"

  publish-manifest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, publish-platform]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifests
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            image="$REGISTRY/$IMAGE_NAME:$IMAGE_TAG-$arch"
            digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -er '.digest')
            sources+=("$REGISTRY/$IMAGE_NAME@$digest")
          done
          for tag in "$IMAGE_TAG" main; do
            image="$REGISTRY/$IMAGE_NAME:$tag"
            docker buildx imagetools create --tag "$image" "${sources[@]}"
            docker buildx imagetools inspect --raw "$image" > /tmp/manifest.json
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' /tmp/manifest.json
          done
