name: Build, test, and publish

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release --warnaserror
      - name: Test managed app
        shell: bash
        run: |
          dotnet src/HttpHeaders.Api/bin/Release/net10.0/HttpHeaders.Api.dll --urls http://127.0.0.1:8080 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          python3 tests/smoke.py http://127.0.0.1:8080
        env:
          Diagnostics__RedactedHeaders__0: X-Custom-Secret
      - uses: docker/setup-buildx-action@v3
      - name: Build NativeAOT container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/HttpHeaders.Api/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: xforwarded:test
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Test NativeAOT container
        run: bash tests/container.sh xforwarded:test
      - name: Save tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save xforwarded:test -o /tmp/xforwarded-image.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-image
          path: /tmp/xforwarded-image.tar
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
          path: /tmp
      - run: docker load -i /tmp/xforwarded-image.tar
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,format=long
      - name: Publish the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag xforwarded:test "$tag"
            docker push "$tag"
          done <<< "$TAGS"
