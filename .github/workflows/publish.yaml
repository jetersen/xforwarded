name: Build, test, and publish

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release --warnaserror
      - name: Test managed app
        shell: bash
        run: |
          dotnet src/HttpHeaders.Api/bin/Release/net10.0/HttpHeaders.Api.dll --urls http://127.0.0.1:8080 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          python3 tests/smoke.py http://127.0.0.1:8080
        env:
          Diagnostics__RedactedHeaders__0: X-Custom-Secret
      - uses: docker/setup-buildx-action@v3
      - name: Build NativeAOT container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/HttpHeaders.Api/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: xforwarded:test-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Test NativeAOT container
        run: bash tests/container.sh xforwarded:test-${{ matrix.arch }}
      - name: Save tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save xforwarded:test-${{ matrix.arch }} -o /tmp/xforwarded-${{ matrix.arch }}.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-image-${{ matrix.arch }}
          path: /tmp/xforwarded-${{ matrix.arch }}.tar
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tested-image-*
          merge-multiple: true
          path: /tmp/images
      - name: Load tested images
        run: |
          for arch in amd64 arm64; do
            docker load -i "/tmp/images/xforwarded-$arch.tar"
            test "$(docker image inspect --format '{{.Architecture}}' "xforwarded:test-$arch")" = "$arch"
          done
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=sha,format=long
      - name: Publish tested images and multi-platform manifests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            image="$REGISTRY/$IMAGE_NAME:sha-$GITHUB_SHA-$arch"
            docker tag "xforwarded:test-$arch" "$image"
            docker push "$image"
            sources+=("$image")
          done
          while IFS= read -r tag; do
            docker buildx imagetools create --tag "$tag" "${sources[@]}"
            docker buildx imagetools inspect --raw "$tag" > /tmp/manifest.json
            python3 - <<'PYTHON'
          import json
          platforms = {(m['platform']['os'], m['platform']['architecture'])
                       for m in json.load(open('/tmp/manifest.json'))['manifests']}
          assert platforms == {('linux', 'amd64'), ('linux', 'arm64')}, platforms
          PYTHON
          done <<< "$TAGS"
