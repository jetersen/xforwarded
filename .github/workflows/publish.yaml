name: Build and publish

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: linux-x64
            runner: ubuntu-26.04
          - arch: arm64
            rid: linux-arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install NativeAOT zlib headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build NativeAOT SDK container
        env:
          RID: ${{ matrix.rid }}
          ARCH: ${{ matrix.arch }}
        run: >-
          dotnet publish src/HttpHeaders.Api/HttpHeaders.Api.csproj
          -t:PublishContainer -c Release -r "$RID" --warnaserror
          -p:ContainerImageTag="build-$ARCH"

  publish-platform:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rid: linux-x64
            runner: ubuntu-26.04
          - arch: arm64
            rid: linux-arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install NativeAOT zlib headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish NativeAOT container with the SDK
        env:
          RID: ${{ matrix.rid }}
          ARCH: ${{ matrix.arch }}
        run: >-
          dotnet publish src/HttpHeaders.Api/HttpHeaders.Api.csproj
          -t:PublishContainer -c Release -r "$RID" --warnaserror
          -p:ContainerRegistry="$REGISTRY" -p:ContainerRepository="$IMAGE_NAME"
          -p:ContainerImageTag="sha-$GITHUB_SHA-$ARCH"
      - name: Record published digest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="$REGISTRY/$IMAGE_NAME:sha-$GITHUB_SHA-$ARCH"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r '.digest')
          reference="$REGISTRY/$IMAGE_NAME@$digest"
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$reference" > "$RUNNER_TEMP/digests/$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*.txt
          retention-days: 1

  publish-manifest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-platform
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifests
        run: |
          sources=("$(cat /tmp/digests/amd64.txt)" "$(cat /tmp/digests/arm64.txt)")
          for tag in "sha-$GITHUB_SHA" main; do
            image="$REGISTRY/$IMAGE_NAME:$tag"
            docker buildx imagetools create --tag "$image" "${sources[@]}"
            docker buildx imagetools inspect --raw "$image" > /tmp/manifest.json
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' /tmp/manifest.json
          done
